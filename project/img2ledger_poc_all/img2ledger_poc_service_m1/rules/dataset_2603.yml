extends: "default.yml"

dataset:
  name: "2603销售明细表"
  images_glob: "../dataset_2603/**/3-*.jpg"

  filename_date_map:
    "3-19": "2026-03-19"
    "3-20": "2026-03-20"
    "3-21": "2026-03-21"
    "3-22": "2026-03-22"
    "3-23": "2026-03-23"
    "3-24": "2026-03-24"
    "3-25": "2026-03-25"
    "3-26": "2026-03-26"
    "3-27": "2026-03-27"
    "3-28": "2026-03-28"
    "3-29": "2026-03-29"

patterns:
  formula:
    - name: formula
      regex: '(?P<jin>\d+(?:\.\d+)?)\s*[x×X\*]\s*(?P<price>\d+(?:\.\d+)?)(?:\s*[=＝]\s*(?P<amount>\d+(?:\.\d+)?))?'
    - name: formula_fallback
      regex: '(?P<jin>\d+(?:\.\d+)?)\s+(?P<price>\d{2,}(?:\.\d+)?)(?:\s[=＝]?\s*(?P<amount>\d{2,}(?:\.\d+)?))?'

normalize:
  multiply_symbols: ["x", "X", "×", "*"]

# 针对数据集的覆盖项（可持续沉淀）
overrides:
  customer_alias:
    "宋姐.": "王志华"
    "宋姐": "王志华"
    "字姐": "王志华"
    "徐点(法)": "王志华"
    "徐总": "王志华"
    "渊": "王志华"
    "常租": "常其稳"
    "常总": "常其稳"
    "常长稳": "常其稳"
    "常建": "常其稳"
    "苏州刘点": "苏州刘总"
    "苏州你": "苏州（徐）"
    "合参": "合叁"
    "王语": "王浩"
    "龙": "乐敏"

  ratio_semantics_by_customer:
    "散客": "unknown"

  product_alias:
    "黑包": "黑全包"
    "黑全包": "黑全包"
    "黑金": "黑金"
    "蓝金": "蓝金"
    "玫里金": "玫里金"
    "法成": "法成"
    "价": "帝王蟹"
    "黑": "黑金鲍"
    "14": "澳纽龙-沃龙"
    "43": "澳纽龙-沃龙"
    "只": "澳纽龙-沃龙"
